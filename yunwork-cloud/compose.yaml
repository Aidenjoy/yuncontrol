services:
  controller:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/yunwork-cloud:/srv/yunwork-cloud
    ports:
      - "127.0.0.1:${YUNWORK_CLOUD_PORT:-8090}:8090"
    command: ["sh", "-c", "uvicorn yunwork_cloud.main:create_app --factory --host 0.0.0.0 --port ${YUNWORK_CLOUD_PORT:-8090}"]
